<%
  require 'json'
  cluster_ips = link('vault').instances.map { |i| i.address }
  if p('safe.peer.tls.ca',   '').empty? or
     p('safe.peer.tls.certificate', '').empty? or
     p('safe.peer.tls.key',  '').empty? then

    if p('safe.peer.tls.verify') then
      raise "You cannot set `safe.peer.tls.verify` without providing a peer and CA certificates"
    end
  end

  # Leave behaviour.  bin/consul stops the server with SIGINT, and Consul
  # leaves the cluster on SIGINT only when skip_leave_on_interrupt is false,
  # and on SIGTERM only when leave_on_terminate is true.  A server that leaves
  # is removed from the raft configuration, so a rolling restart would shrink
  # the voter set and shift the quorum on every step.  Both settings below keep
  # a stopping server in raft on either signal, so it rejoins as the same voter
  # (its node ID lives on the persistent disk) and the quorum size never moves.
  # Removing a server for good, as on a scale-down, needs `consul leave` or
  # `consul force-leave`, or autopilot's dead-server cleanup.
%>
{
  "datacenter":         "vault",
  "leave_on_terminate":      false,
  "skip_leave_on_interrupt": true,
  "server":             true,
  "retry_join":       <%= cluster_ips.to_json %>,
  "bootstrap_expect": <%= cluster_ips.size %>,
  <%=  p('safe.peer.force_bind_default_ip') ? "\"bind_addr\": \"#{spec.ip}\"," : "" %>
  "tls": {
    "defaults": {
      "verify_incoming": false,
      "verify_outgoing": <% if p('safe.peer.tls.verify') %>true<% else %>false<% end %>,
      "ca_file":         "/var/vcap/jobs/vault/tls/peer/ca.pem",
      "cert_file":       "/var/vcap/jobs/vault/tls/peer/cert.pem",
      "key_file":        "/var/vcap/jobs/vault/tls/peer/key.pem"
    }
  },
  "connect": {
    "enabled": false
  },
  "peering": {
    "enabled": false
  },
  "ports": {
    "http":  -1,
    "https": 8500
  }
}
